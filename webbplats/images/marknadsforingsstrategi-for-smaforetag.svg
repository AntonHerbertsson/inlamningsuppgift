<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Från affärsmål till uppföljning</title><desc id="desc">Sex steg i en digital marknadsföringsstrategi med återkoppling från uppföljning till mål.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#29604c" stroke-width="2"/></marker></defs><rect width="1200" height="720" rx="28" fill="#f3f5ed"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="70" y="85" font-size="19" letter-spacing="3">DIGITAL STRATEGI</text><text x="70" y="145" font-size="40" font-weight="700">En plan som hjälper företaget framåt</text><text x="70" y="190" font-size="23">Välj riktning. Genomför. Lär av resultatet.</text><g transform="translate(70 250)"><rect width="300" height="140" rx="18" fill="#fff" stroke="#c9d8ca" stroke-width="2"/><text x="22" y="36" font-size="20" fill="#527665">01</text><text x="22" y="76" font-size="27" font-weight="700">Mål</text><text x="22" y="112" font-size="19">Vad ska arbetet ge?</text></g><g transform="translate(450 250)"><rect width="300" height="140" rx="18" fill="#fff" stroke="#c9d8ca" stroke-width="2"/><text x="22" y="36" font-size="20" fill="#527665">02</text><text x="22" y="76" font-size="27" font-weight="700">Målgrupp</text><text x="22" y="112" font-size="19">Vem vill ni nå?</text></g><g transform="translate(830 250)"><rect width="300" height="140" rx="18" fill="#fff" stroke="#c9d8ca" stroke-width="2"/><text x="22" y="36" font-size="20" fill="#527665">03</text><text x="22" y="76" font-size="27" font-weight="700">Erbjudande</text><text x="22" y="112" font-size="19">Vilket behov löser ni?</text></g><g transform="translate(70 450)"><rect width="300" height="140" rx="18" fill="#fff" stroke="#c9d8ca" stroke-width="2"/><text x="22" y="36" font-size="20" fill="#527665">06</text><text x="22" y="76" font-size="27" font-weight="700">Uppföljning</text><text x="22" y="112" font-size="19">Vad behöver förbättras?</text></g><g transform="translate(450 450)"><rect width="300" height="140" rx="18" fill="#fff" stroke="#c9d8ca" stroke-width="2"/><text x="22" y="36" font-size="20" fill="#527665">05</text><text x="22" y="76" font-size="27" font-weight="700">Genomförande</text><text x="22" y="112" font-size="19">Vem gör vad och när?</text></g><g transform="translate(830 450)"><rect width="300" height="140" rx="18" fill="#fff" stroke="#c9d8ca" stroke-width="2"/><text x="22" y="36" font-size="20" fill="#527665">04</text><text x="22" y="76" font-size="27" font-weight="700">Kanaler</text><text x="22" y="112" font-size="19">Var möter ni kunden?</text></g><g fill="none" stroke="#29604c" stroke-width="3" marker-end="url(#arrow)"><path d="M385 320H430"/><path d="M765 320H810"/><path d="M980 405V430"/><path d="M810 520H765"/><path d="M430 520H385"/><path d="M220 435V405" stroke-dasharray="6 7"/></g><text x="70" y="654" font-size="21">Låt kundernas behov och affärens resultat styra nästa steg.</text></g></svg>
