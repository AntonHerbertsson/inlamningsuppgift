<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">SEO för småföretag</title><desc id="desc">Kundfrågor, innehåll, lokal synlighet och uppföljning kopplas till företagets webbplats.</desc><rect width="1200" height="720" rx="24" fill="#f3f5ed"/><g font-family="Arial, sans-serif" fill="#173f32"><text x="70" y="90" font-size="19" letter-spacing="3">VÄX DIGITAL · SEO</text><text x="70" y="150" font-size="43" font-weight="700">Gör det lättare att hitta rätt</text><text x="70" y="196" font-size="23">Fyra delar att arbeta med steg för steg</text><g fill="none" stroke="#709783" stroke-width="3"><path d="M370 325L440 380M830 325L760 380M370 545L440 455M830 545L760 455"/></g><rect x="440" y="340" width="320" height="150" rx="20" fill="#173f32"/><g fill="#fff"><text x="600" y="398" text-anchor="middle" font-size="28" font-weight="700">Företagets</text><text x="600" y="438" text-anchor="middle" font-size="28" font-weight="700">webbplats</text></g><g transform="translate(70 260)"><rect width="300" height="135" rx="18" fill="#fff" stroke="#c9d8ca" stroke-width="2"/><text x="22" y="32" font-size="19" fill="#527665">01</text><text x="22" y="72" font-size="26" font-weight="700">Kundernas frågor</text><text x="22" y="109" font-size="21">Förstå behovet</text></g><g transform="translate(830 260)"><rect width="300" height="135" rx="18" fill="#fff" stroke="#c9d8ca" stroke-width="2"/><text x="22" y="32" font-size="19" fill="#527665">02</text><text x="22" y="72" font-size="26" font-weight="700">Tydligt innehåll</text><text x="22" y="109" font-size="21">Besvara och vägled</text></g><g transform="translate(70 480)"><rect width="300" height="135" rx="18" fill="#fff" stroke="#c9d8ca" stroke-width="2"/><text x="22" y="32" font-size="19" fill="#527665">03</text><text x="22" y="72" font-size="26" font-weight="700">Lokal synlighet</text><text x="22" y="109" font-size="21">Håll uppgifter aktuella</text></g><g transform="translate(830 480)"><rect width="300" height="135" rx="18" fill="#fff" stroke="#c9d8ca" stroke-width="2"/><text x="22" y="32" font-size="19" fill="#527665">04</text><text x="22" y="72" font-size="26" font-weight="700">Uppföljning</text><text x="22" y="109" font-size="21">Mät och förbättra</text></g><text x="70" y="674" font-size="21">Utgå från kunden och följ vägen från sökning till kontakt.</text></g></svg>
